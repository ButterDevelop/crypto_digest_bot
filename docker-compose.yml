services:
  bot:
    image: ghcr.io/butterdevelop/crypto_digest_bot:latest
    container_name: crypto-digest-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/bot.db
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M
